name: Build Jellyfin 12.2 plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Package plugin
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Check JavaScript
        shell: bash
        run: |
          for script in Files/wwwroot/*.js scripts/*.mjs; do node --check "$script"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Baklava-Jellyfin-12.2
          path: artifacts/*
